name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify pull request head provenance
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Interaction governance authority check
        run: npm run check:interaction-governance

      - name: Governance policy stress tests
        run: npm run test:governance-policies

      - name: Pull request governance declaration
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run check:pr-governance

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=low

      - name: Design token governance
        run: npm run check:design-tokens

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
        env:
          ATRVISU_CAPTURE_PF1_REVIEW_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 110 && '1' || '0' }}
          ATRVISU_CAPTURE_PF2A_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-asset-browser-discovery-v01' && '1' || '0' }}
          ATRVISU_CAPTURE_PF2B_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-native-asset-import-v01' && '1' || '0' }}
          ATRVISU_CAPTURE_PF3A_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-global-iconography-density-v01' && '1' || '0' }}
          ATRVISU_CAPTURE_PF3B_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-pf3b-viewport-visual-runtime-v01' && '1' || '0' }}
          ATRVISU_CAPTURE_CLOSE_NAV_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/p1-close-nav-runtime-v01' && '1' || '0' }}
          ATRVISU_CAPTURE_PAN_GRID_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/p1-viewport-pan-grid-runtime-v01' && '1' || '0' }}
          ATRVISU_CAPTURE_P1_BLD2_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-level-datum-v01' && '1' || '0' }}
          ATRVISU_E2E_EXPECTED_SOURCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Validate exact-head Pan and grid evidence
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/p1-viewport-pan-grid-runtime-v01' }}
        run: node scripts/validate-pan-grid-evidence.mjs
        env:
          ATRVISU_E2E_EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Reproduce C03 owner-task failures on the faithful historical port
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'codex/c03-v2-task-runtime-stage-b-v01' || github.event.pull_request.head.ref == 'codex/c03-professional-measure-recovery-v01') }}
        shell: bash
        env:
          ATRVISU_C03_DELIVERY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          baseline="$RUNNER_TEMP/c03-owner-baseline"
          git worktree add --detach "$baseline" 76bac9fac43a3a1ebba1a24285d5c28021c57f00
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          cd "$baseline"
          test -z "$(git diff 17763309b532813a7e004d608992073a97c08bb0 -- src ':(exclude)**/*.test.ts' ':(exclude)**/*.test.tsx')"
          if npm run test -- --run src/measure/measureTask.test.ts --reporter=json --outputFile="$RUNNER_TEMP/c03-baseline-unit.json"; then
            echo "Historical regression assertions unexpectedly passed"
            exit 1
          fi
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));require("assert/strict").equal(r.numFailedTests,5);require("assert/strict").equal(r.numTotalTests,5)' "$RUNNER_TEMP/c03-baseline-unit.json"
          ATRVISU_MEASURE_TASK_BASELINE=1 npm run test:e2e -- --grep 'C03 renewed baseline'
          mkdir -p "$GITHUB_WORKSPACE/test-results/c03-measure-v2-task"
          cp -R test-results/c03-measure-v2-task/baseline "$GITHUB_WORKSPACE/test-results/c03-measure-v2-task/"
          cp "$RUNNER_TEMP/c03-baseline-unit.json" "$GITHUB_WORKSPACE/test-results/c03-measure-v2-task/baseline-unit.json"

      - name: Validate exact-head C03 task and protected regression evidence
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'codex/c03-v2-task-runtime-stage-b-v01' || github.event.pull_request.head.ref == 'codex/c03-professional-measure-recovery-v01') }}
        run: |
          node scripts/validate-measure-v2-evidence.mjs
          node scripts/validate-measure-v2-task-evidence.mjs
        env:
          ATRVISU_E2E_EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Reproduce rejected C03 recovery baseline without changing its product source
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/c03-professional-measure-recovery-v01' }}
        shell: bash
        env:
          ATRVISU_C03_RECOVERY_DELIVERY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          baseline="$RUNNER_TEMP/c03-recovery-baseline"
          git worktree add --detach "$baseline" dc1ac534eff517410f41ebe390ec513b494ebd8b
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          cp e2e/app-smoke.spec.ts e2e/measureV2TaskEvidence.ts e2e/measureRecoveryEvidence.ts "$baseline/e2e/"
          cp src/measure/measureRecoveryContract.test.ts "$baseline/src/measure/"
          cd "$baseline"
          test -z "$(git diff dc1ac534eff517410f41ebe390ec513b494ebd8b -- src ':(exclude)**/*.test.ts' ':(exclude)**/*.test.tsx')"
          if npm run test -- --run src/measure/measureRecoveryContract.test.ts --reporter=json --outputFile="$RUNNER_TEMP/c03-recovery-unit.json"; then
            echo "Rejected-baseline assertions unexpectedly passed"
            exit 1
          fi
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));require("assert/strict").equal(r.numFailedTests,5);require("assert/strict").equal(r.numTotalTests,5)' "$RUNNER_TEMP/c03-recovery-unit.json"
          ATRVISU_MEASURE_RECOVERY_BASELINE=1 npm run test:e2e -- --grep 'C03 recovery baseline'
          mkdir -p "$GITHUB_WORKSPACE/test-results/c03-measure-recovery"
          cp -R test-results/c03-measure-recovery/baseline "$GITHUB_WORKSPACE/test-results/c03-measure-recovery/"
          cp "$RUNNER_TEMP/c03-recovery-unit.json" "$GITHUB_WORKSPACE/test-results/c03-measure-recovery/baseline-unit.json"

      - name: Validate exact-head professional Measure recovery evidence
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/c03-professional-measure-recovery-v01' }}
        run: node scripts/validate-measure-recovery-evidence.mjs
        env:
          ATRVISU_E2E_EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Upload professional Measure recovery user-route evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/c03-professional-measure-recovery-v01' }}
        uses: actions/upload-artifact@v4
        with:
          name: c03-professional-measure-recovery
          path: |
            test-results/c03-measure-recovery
            test-results/c03-measure-v2-task
            test-results/c03-measure-v2-stage-b
          if-no-files-found: error
          retention-days: 30

      - name: Upload C03 renewed task runtime evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/c03-v2-task-runtime-stage-b-v01' }}
        uses: actions/upload-artifact@v4
        with:
          name: c03-measure-v2-task-runtime-stage-b
          path: |
            test-results/c03-measure-v2-task
            test-results/c03-measure-v2-stage-b
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pan and grid runtime evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/p1-viewport-pan-grid-runtime-v01' }}
        uses: actions/upload-artifact@v4
        with:
          name: p1-viewport-pan-grid-runtime
          path: test-results/p1-viewport-pan-grid-runtime
          if-no-files-found: error
          retention-days: 30

      - name: Upload PF-1 review evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 110 }}
        uses: actions/upload-artifact@v4
        with:
          name: pf1-review-5064733007
          path: test-results/pf1-review-5064733007
          if-no-files-found: error
          retention-days: 30

      - name: Upload PF-2A asset-browser evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-asset-browser-discovery-v01' }}
        uses: actions/upload-artifact@v4
        with:
          name: pf2a-asset-browser-discovery
          path: test-results/pf2a-asset-browser-discovery
          if-no-files-found: error
          retention-days: 30

      - name: Upload PF-2B native asset import evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-native-asset-import-v01' }}
        uses: actions/upload-artifact@v4
        with:
          name: pf2b-native-asset-import
          path: test-results/pf2b-native-asset-import
          if-no-files-found: error
          retention-days: 30

      - name: Upload PF-3A iconography and density evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-global-iconography-density-v01' }}
        uses: actions/upload-artifact@v4
        with:
          name: pf3a-global-iconography-density
          path: test-results/pf3a-global-iconography-density
          if-no-files-found: error
          retention-days: 30

      - name: Upload P1-BLD2 Level datum evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-level-datum-v01' }}
        uses: actions/upload-artifact@v4
        with:
          name: p1-bld2-level-datum
          path: test-results/p1-bld2-level-datum
          if-no-files-found: error
          retention-days: 30

      - name: Upload PF-3B viewport visual language evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/phase-1-pf3b-viewport-visual-runtime-v01' }}
        uses: actions/upload-artifact@v4
        with:
          name: pf3b-viewport-visual-language
          path: test-results/pf3b-viewport-visual-language
          if-no-files-found: error
          retention-days: 30

      - name: Upload P1-CLOSE-NAV viewport navigation evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/p1-close-nav-runtime-v01' }}
        uses: actions/upload-artifact@v4
        with:
          name: p1-close-nav-viewport-navigation
          path: test-results/p1-close-nav-viewport-navigation
          if-no-files-found: error
          retention-days: 30
