name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=low

      - name: Design token governance
        run: npm run check:design-tokens

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
        env:
          ATRVISU_CAPTURE_PF1_REVIEW_EVIDENCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 110 && '1' || '0' }}

      - name: Upload PF-1 review evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 110 }}
        uses: actions/upload-artifact@v4
        with:
          name: pf1-review-5064733007
          path: test-results/pf1-review-5064733007
          if-no-files-found: error
          retention-days: 30
